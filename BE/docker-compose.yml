version: '3.8'

services:
  app:
    build: .
    ports:
      - "${HTTP_PORT:-8080}:${HTTP_PORT:-8080}"
    env_file:
      - .env
    depends_on:
      - db
    restart: unless-stopped
    networks:
      - CoreSync-network

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-CoreSync_db}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASS:-password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    restart: unless-stopped
    networks:
      - CoreSync-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Optional: Add Redis for caching (if needed)
  # redis:
  #   image: redis:7-alpine
  #   ports:
  #     - "6379:6379"
  #   restart: unless-stopped
  #   networks:
  #     - CoreSync-network

networks:
  CoreSync-network:
    driver: bridge

volumes:
  postgres_data:
